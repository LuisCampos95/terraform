# Template: infra
# Repos de infraestrutura — acesso ao state backend no S3 e operações de EC2.
# Gerenciado pelo time de plataforma. Developers NÃO editam este arquivo.

permissions:
  - sid: "S3StateBackend"
    actions:
      - "s3:GetObject"
      - "s3:PutObject"
      - "s3:DeleteObject"
      - "s3:ListBucket"
      - "s3:GetBucketVersioning"
    resources:
      - "arn:aws:s3:::kt-terraform-luis"
      - "arn:aws:s3:::kt-terraform-luis/*"

  - sid: "EC2Describe"
    # AWS não suporta resource-level para ações Describe — "*" obrigatório pela AWS.
    actions:
      - "ec2:DescribeInstances"
      - "ec2:DescribeVpcs"
      - "ec2:DescribeSubnets"
      - "ec2:DescribeSecurityGroups"
      - "ec2:DescribeInternetGateways"
      - "ec2:DescribeRouteTables"
      - "ec2:DescribeKeyPairs"
    resources:
      - "*"

  - sid: "EC2Manage"
    actions:
      - "ec2:RunInstances"
      - "ec2:TerminateInstances"
      - "ec2:StartInstances"
      - "ec2:StopInstances"
      - "ec2:CreateTags"
      - "ec2:CreateVpc"
      - "ec2:DeleteVpc"
      - "ec2:CreateSubnet"
      - "ec2:DeleteSubnet"
      - "ec2:CreateInternetGateway"
      - "ec2:DeleteInternetGateway"
      - "ec2:AttachInternetGateway"
      - "ec2:DetachInternetGateway"
      - "ec2:CreateSecurityGroup"
      - "ec2:DeleteSecurityGroup"
      - "ec2:AuthorizeSecurityGroupIngress"
      - "ec2:AuthorizeSecurityGroupEgress"
      - "ec2:RevokeSecurityGroupIngress"
      - "ec2:RevokeSecurityGroupEgress"
      - "ec2:CreateRouteTable"
      - "ec2:DeleteRouteTable"
      - "ec2:CreateRoute"
      - "ec2:AssociateRouteTable"
    resources:
      - "arn:aws:ec2:us-east-1:*:instance/*"
      - "arn:aws:ec2:us-east-1::image/*"
      - "arn:aws:ec2:us-east-1:*:subnet/*"
      - "arn:aws:ec2:us-east-1:*:vpc/*"
      - "arn:aws:ec2:us-east-1:*:internet-gateway/*"
      - "arn:aws:ec2:us-east-1:*:security-group/*"
      - "arn:aws:ec2:us-east-1:*:route-table/*"
      - "arn:aws:ec2:us-east-1:*:network-interface/*"
      - "arn:aws:ec2:us-east-1:*:key-pair/*"
