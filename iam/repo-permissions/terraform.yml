# Permissões do repositório luiscampos95/terraform
# Cada 'permissions' define actions e resources explícitos — sem asterisco em actions.
# Para actions que a AWS não suporta resource-level (ex: ec2:Describe*),
# resources deve ser ["*"] — isso é uma limitação da própria AWS, não da política.

repo: "luiscampos95/terraform"
permissions:
  - sid: "S3StateBackend"
    actions:
      - "s3:GetObject"
      - "s3:PutObject"
      - "s3:DeleteObject"
      - "s3:ListBucket"
      - "s3:GetBucketVersioning"
    resources:
      - "arn:aws:s3:::kt-terraform-luis"
      - "arn:aws:s3:::kt-terraform-luis/*"

  - sid: "EC2Describe"
    actions:
      - "ec2:DescribeInstances"
      - "ec2:DescribeVpcs"
      - "ec2:DescribeSubnets"
      - "ec2:DescribeSecurityGroups"
      - "ec2:DescribeInternetGateways"
      - "ec2:DescribeRouteTables"
    resources:
      - "*"  # AWS não suporta resource-level para ações Describe de EC2

  - sid: "EC2Manage"
    actions:
      - "ec2:RunInstances"
      - "ec2:TerminateInstances"
      - "ec2:StartInstances"
      - "ec2:StopInstances"
      - "ec2:CreateTags"
    resources:
      - "arn:aws:ec2:us-east-1:*:instance/*"
      - "arn:aws:ec2:us-east-1::image/*"
      - "arn:aws:ec2:us-east-1:*:subnet/*"
      - "arn:aws:ec2:us-east-1:*:network-interface/*"
      - "arn:aws:ec2:us-east-1:*:security-group/*"
      - "arn:aws:ec2:us-east-1:*:key-pair/*"
